[package]
name = "aeron-glide"
version = "0.4.0"
edition = "2024"
rust-version = "1.97"
authors = ["Mehve Labs <mehvelabs@gmail.com>"]
description = "Safe, idiomatic Rust wrapper for the Aeron C++ API via cxx"
license = "Apache-2.0"
repository = "https://github.com/mehve-labs/aeron-glide"
documentation = "https://docs.rs/aeron-glide"
readme = "README.md"
keywords = ["aeron", "messaging", "ipc", "low-latency", "pub-sub"]
categories = ["network-programming", "concurrency"]
exclude = ["scripts/", "aeron-archive/", ".claude/", ".github/"]

[package.metadata.docs.rs]
features = ["archive"]

[features]
default = ["driver"]
# The embedded C media driver (`MediaDriver`). Without it, run a media driver
# separately (e.g. Java's, or this crate's `mediadriver` binary).
driver = []
# The Aeron Archive client (needs Java 17+ to build).
archive = []
# The `mediadriver` binary: `cargo install aeron-glide --features bin`.
bin = ["driver", "dep:ctrlc", "dep:serde", "dep:serde_norway"]

[dependencies]
cxx = "1.0"
ctrlc = { version = "3.5", optional = true, features = ["termination"] }
serde = { version = "1", features = ["derive"], optional = true }
serde_norway = { version = "0.9", optional = true }

[dev-dependencies]
ctrlc = "3.5"
clap = { version = "4", features = ["derive"] }
hdrhistogram = "7"
once_cell = "1.19"

[build-dependencies]
cc = "1.2"
cxx-build = "1.0"
cmake = "0.1"
ureq = "3"
sha2 = "0.11"
tar = "0.4"
flate2 = "1.0"

[[bin]]
name = "mediadriver"
path = "src/bin/mediadriver.rs"
required-features = ["bin"]

