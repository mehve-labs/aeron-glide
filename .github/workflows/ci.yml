name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint & docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2; Aeron needs CMake 3.30+
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y uuid-dev libbsd-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy (all features)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Clippy (client only)
        run: cargo clippy --locked --lib --no-default-features -- -D warnings
      - name: Docs
        run: cargo doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Docs as on docs.rs (no Aeron build)
        run: cargo doc --locked --all-features --no-deps
        env:
          DOCS_RS: 1
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The archive tests run a Java ArchivingMediaDriver; never skip them in CI.
      AERON_GLIDE_REQUIRE_ARCHIVE: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      - name: Install dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y uuid-dev libbsd-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Test (all features)
        run: cargo test --locked --all-features
      - name: Build (client only)
        run: cargo build --locked --no-default-features
      - name: Build the mediadriver binary
        run: cargo build --locked --features bin --bin mediadriver

  msrv:
    name: MSRV (1.97)
    runs-on: ubuntu-latest
    env:
      AERON_GLIDE_REQUIRE_ARCHIVE: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: '1.97'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y uuid-dev libbsd-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Test
        run: cargo test --locked --all-features

  asan:
    name: AddressSanitizer
    runs-on: ubuntu-latest
    env:
      AERON_GLIDE_REQUIRE_ARCHIVE: 1
      RUSTFLAGS: -Zsanitizer=address
      RUSTDOCFLAGS: -Zsanitizer=address
      # Instruments Aeron and the shims only: CFLAGS would also reach build
      # dependencies' C code (e.g. ring), whose build scripts aren't instrumented.
      AERON_GLIDE_SANITIZER: address
      # Instrument Aeron and the shims with the same compiler family as rustc's
      # sanitizer runtime (LLVM).
      CC: clang
      CXX: clang++
      # Aeron keeps some allocations (e.g. static counters) until exit.
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: nightly
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y uuid-dev libbsd-dev
      - name: Test
        run: cargo test --locked --all-features --target x86_64-unknown-linux-gnu --tests

  windows:
    name: Windows (experimental)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build (client and driver)
        run: cargo build --locked
      - name: Test
        run: cargo test --locked
